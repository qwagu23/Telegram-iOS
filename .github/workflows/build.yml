
name: Build Clean Swiftgram IPA

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: |
          set -e

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app /Applications/Xcode-26.2*.app 2>/dev/null | head -n 1 || true)

          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26.2 was not found."
            xcodebuild -version || true
            exit 1
          fi

          echo "Using: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          xcodebuild -version
          xcode-select -p

      - name: Prepare Swiftgram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          test -n "$TELEGRAM_API_ID"
          test -n "$TELEGRAM_API_HASH"

          python3 - <<'PY'
          import json
          import os

          api_id = os.environ["TELEGRAM_API_ID"]
          api_hash = os.environ["TELEGRAM_API_HASH"]

          configuration = {
              "sg_config": "",
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "true",
              "appstore_id": "686449807",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
              "enable_siri": True,
              "enable_icloud": True
          }

          with open("swiftgram-build-configuration.json", "w") as f:
              json.dump(configuration, f, indent=2)

          print("Swiftgram configuration generated.")
          print("Bundle ID:", configuration["bundle_id"])
          print("Team ID:", configuration["team_id"])
          print("API credentials: loaded from GitHub Secrets")
          PY

          echo "Configuration:"
          cat swiftgram-build-configuration.json | sed \
            -e 's/"api_hash": ".*"/"api_hash": "***"/' \
            -e 's/"api_id": ".*"/"api_id": "***"/'

      - name: Verify fake codesigning files
        run: |
          set -e

          echo "Profiles:"
          find build-system/fake-codesigning/profiles \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            -print \
            | sort

          echo
          echo "Certificates:"
          find build-system/fake-codesigning/certs \
            -maxdepth 1 \
            -type f \
            \( -name "*.p12" -o -name "*.cer" \) \
            -print \
            | sort

          echo
          PROFILE_COUNT=$(find build-system/fake-codesigning/profiles \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            | wc -l | tr -d ' ')

          CERT_COUNT=$(find build-system/fake-codesigning/certs \
            -maxdepth 1 \
            -type f \
            \( -name "*.p12" -o -name "*.cer" \) \
            | wc -l | tr -d ' ')

          echo "Provisioning profiles: $PROFILE_COUNT"
          echo "Certificates: $CERT_COUNT"

          test "$PROFILE_COUNT" -gt 0
          test "$CERT_COUNT" -gt 0

      - name: Validate main provisioning profile
        run: |
          set -e

          PROFILE="build-system/fake-codesigning/profiles/Telegram.mobileprovision"

          if [ ! -f "$PROFILE" ]; then
            echo "Telegram.mobileprovision not found."
            exit 1
          fi

          security cms -D -i "$PROFILE" > /tmp/telegram-profile.plist

          echo "Main provisioning profile:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/telegram-profile.plist || true
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/telegram-profile.plist || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/telegram-profile.plist || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/telegram-profile.plist || true

          APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              /tmp/telegram-profile.plist
          )

          APS=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              /tmp/telegram-profile.plist
          )

          test "$APP_ID" = "C67CF9S4VU.ph.telegra.Telegraph"
          test "$APS" = "production"

          echo
          echo "Provisioning profile matches:"
          echo "  Team ID: C67CF9S4VU"
          echo "  Bundle ID: ph.telegra.Telegraph"
          echo "  APS: production"

      - name: Import fake signing certificates
        run: |
          set -e

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo
          echo "Available code-signing identities:"
          security find-identity -v -p codesigning || true

      - name: Show build environment
        run: |
          set -e

          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Swift:"
          swift --version

          echo
          echo "Git:"
          git --version

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Build number offset:"
          cat build_number_offset || true

      - name: Build Swiftgram arm64 IPA
        env:
          BUILD_NUMBER: "34492"
        run: |
          set -e

          rm -rf build/artifacts
          mkdir -p build/artifacts

          python3 -u build-system/Make/Make.py \
            --cacheDir="/Users/runner/telegram-bazel-cache" \
            build \
            --configurationPath="swiftgram-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts"

      - name: Verify Swiftgram IPA
        run: |
          set -e

          IPA="build/artifacts/Swiftgram.ipa"

          if [ ! -f "$IPA" ]; then
            echo "Swiftgram IPA was not generated."
            echo
            echo "Contents of build/artifacts:"
            find build/artifacts -maxdepth 3 -print || true
            echo
            echo "Searching entire repository for IPA files:"
            find . -type f -name "*.ipa" -print || true
            exit 1
          fi

          echo "IPA found:"
          ls -lh "$IPA"

          echo
          echo "IPA contents:"
          unzip -l "$IPA" | head -n 80

          echo
          echo "Checking Payload..."
          unzip -q "$IPA" -d /tmp/swiftgram-ipa

          APP="/tmp/swiftgram-ipa/Payload/Telegram.app"

          if [ ! -d "$APP" ]; then
            echo "Telegram.app was not found inside the IPA."
            find /tmp/swiftgram-ipa -maxdepth 4 -print
            exit 1
          fi

          echo
          echo "App bundle:"
          ls -lah "$APP" | head -n 40

          echo
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

          echo
          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"

      - name: Upload Swiftgram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-iOS-arm64
          path: |
            build/artifacts/Swiftgram.ipa
            build/artifacts/Swiftgram.DSYMs.zip
          if-no-files-found: error
          retention-days: 7
