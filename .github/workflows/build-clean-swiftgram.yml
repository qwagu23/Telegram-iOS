      - name: Diagnose APS provisioning check
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "APS provisioning diagnostic"
          echo "========================================"

          echo
          echo "=== Make.py APS check ==="

          grep -n -B 12 -A 18 \
            "Could not find a valid aps-environment" \
            build-system/Make/Make.py || true

          echo
          echo "=== Provisioning profiles ==="

          find build-system/fake-codesigning/profiles \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            -print | sort

          echo
          echo "=== APS values in provisioning profiles ==="

          for profile in build-system/fake-codesigning/profiles/*.mobileprovision; do
            echo
            echo "----------------------------------------"
            echo "Profile: $profile"
            echo "----------------------------------------"

            security cms -D -i "$profile" > /tmp/profile.plist 2>/dev/null || {
              echo "ERROR: Could not decode provisioning profile"
              continue
            }

            echo "Application identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              /tmp/profile.plist 2>/dev/null || echo "MISSING"

            echo "APS environment:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              /tmp/profile.plist 2>/dev/null || echo "MISSING"

            echo "Team identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:com.apple.developer.team-identifier" \
              /tmp/profile.plist 2>/dev/null || echo "MISSING"

            echo "Profile name:"
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              /tmp/profile.plist 2>/dev/null || echo "MISSING"

            echo "Expiration date:"
            /usr/libexec/PlistBuddy \
              -c "Print :ExpirationDate" \
              /tmp/profile.plist 2>/dev/null || echo "MISSING"
          done

          echo
          echo "========================================"
          echo "Running ImportCertificates.py"
          echo "========================================"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs
