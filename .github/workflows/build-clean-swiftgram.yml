      - name: Import certificates and validate provisioning
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Provisioning profiles diagnostic"
          echo "========================================"

          PROFILE_DIR="build-system/fake-codesigning/profiles"
          CERT_DIR="build-system/fake-codesigning/certs"

          if [ ! -d "$PROFILE_DIR" ]; then
            echo "ERROR: Provisioning profiles directory not found:"
            echo "$PROFILE_DIR"
            exit 1
          fi

          if [ ! -d "$CERT_DIR" ]; then
            echo "ERROR: Certificates directory not found:"
            echo "$CERT_DIR"
            exit 1
          fi

          echo
          echo "Profiles found:"
          find "$PROFILE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            -print | sort

          echo
          echo "Checking provisioning profiles..."
          echo

          APS_FOUND=0

          for profile in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$profile" ] || continue

            echo "----------------------------------------"
            echo "Profile: $profile"
            echo "----------------------------------------"

            TMP_PLIST="$(mktemp)"

            if ! security cms -D -i "$profile" > "$TMP_PLIST" 2>/dev/null; then
              echo "ERROR: Cannot decode profile"
              rm -f "$TMP_PLIST"
              exit 1
            fi

            PROFILE_NAME=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Name" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            APP_ID=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:application-identifier" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            APS_ENV=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:aps-environment" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            TEAM_ID=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:com.apple.developer.team-identifier" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            echo "Profile name: ${PROFILE_NAME:-MISSING}"
            echo "Application identifier: ${APP_ID:-MISSING}"
            echo "Team identifier: ${TEAM_ID:-MISSING}"
            echo "APS environment: ${APS_ENV:-MISSING}"

            if [ -n "$APS_ENV" ]; then
              APS_FOUND=1
            fi

            rm -f "$TMP_PLIST"
            echo
          done

          echo "========================================"
          echo "APS check result"
          echo "========================================"

          if [ "$APS_FOUND" -ne 1 ]; then
            echo "ERROR: No provisioning profile contains aps-environment."
            exit 1
          fi

          echo "Valid APS provisioning profile found."

          echo
          echo "========================================"
          echo "Importing certificates"
          echo "========================================"

          python3 build-system/Make/ImportCertificates.py \
            --path "$CERT_DIR"

          echo
          echo "========================================"
          echo "Certificate import completed"
          echo "========================================"
