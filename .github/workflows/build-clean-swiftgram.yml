name: Build Clean Swiftgram IPA

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: |
          set -e

          echo "Available Xcode installations:"
          ls -la /Applications | grep Xcode || true

          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
          else
            echo "ERROR: Xcode 26.2 was not found."
            xcodebuild -version || true
            exit 1
          fi

          echo
          echo "Selected Xcode:"
          xcodebuild -version

      - name: Prepare Swiftgram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          python3 - <<'PY'
          import json
          import os

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

          if not api_id:
              raise SystemExit("ERROR: TELEGRAM_API_ID secret is empty")

          if not api_hash:
              raise SystemExit("ERROR: TELEGRAM_API_HASH secret is empty")

          configuration = {
              "sg_config": "",
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "true",
              "appstore_id": "686449807",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
              "enable_siri": True,
              "enable_icloud": True
          }

          path = "swiftgram-build-configuration.json"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(configuration, f, indent=2)
              f.write("\n")

          print("Swiftgram configuration generated.")
          print("Bundle ID:", configuration["bundle_id"])
          print("Team ID:", configuration["team_id"])
          print("API credentials: loaded from GitHub Secrets")
          print("Configuration file:", path)

          with open(path, encoding="utf-8") as f:
              json.load(f)

          print("JSON validation successful.")
          PY

      - name: Verify provisioning profiles
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          PROFILE_DIR="build-system/fake-codesigning/profiles"
          CERT_DIR="build-system/fake-codesigning/certs"

          echo "========================================"
          echo "Codesigning material"
          echo "========================================"

          echo
          echo "Profiles:"
          find "$PROFILE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mobileprovision" \
            -print | sort

          echo
          echo "Certificates:"
          find "$CERT_DIR" \
            -maxdepth 1 \
            -type f \
            \( -name "*.p12" -o -name "*.cer" \) \
            -print | sort

          echo
          echo "========================================"
          echo "Checking profiles for:"
          echo "C67CF9S4VU.ph.telegra.Telegraph"
          echo "========================================"

          FOUND=0

          for profile in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$profile" ] || continue

            TMP_PLIST="$(mktemp)"

            security cms -D -i "$profile" > "$TMP_PLIST"

            APP_ID=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:application-identifier" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            APS_ENV=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:aps-environment" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            PROFILE_NAME=$(
              /usr/libexec/PlistBuddy \
                -c "Print :Name" \
                "$TMP_PLIST" 2>/dev/null || true
            )

            echo
            echo "Profile: $profile"
            echo "Name: ${PROFILE_NAME:-MISSING}"
            echo "Application identifier: ${APP_ID:-MISSING}"
            echo "APS environment: ${APS_ENV:-MISSING}"

            if [ "$APP_ID" = "C67CF9S4VU.ph.telegra.Telegraph" ] && \
               [ "$APS_ENV" = "production" ]; then
              FOUND=1
              echo ">>> VALID MAIN PROFILE FOUND <<<"
            fi

            rm -f "$TMP_PLIST"
          done

          echo
          echo "========================================"

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: Required Telegram provisioning profile was not found."
            echo
            echo "Expected:"
            echo "Application identifier: C67CF9S4VU.ph.telegra.Telegraph"
            echo "APS environment: production"
            exit 1
          fi

          echo "Provisioning profile check PASSED."

      - name: Import certificates
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Importing certificates"
          echo "========================================"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo
          echo "Certificate import completed."

      - name: Generate Xcode project
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          rm -rf build-input/configuration-repository

          python3 build-system/Make/Make.py \
            --cacheDir="/Users/runner/telegram-bazel-cache" \
            generateProject \
            --configurationPath="swiftgram-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber=34492 \
            --projectIncludeRelease

      - name: Build clean arm64 Swiftgram IPA
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          rm -rf build/artifacts
          mkdir -p build/artifacts

          python3 build-system/Make/Make.py \
            --cacheDir="/Users/runner/telegram-bazel-cache" \
            build \
            --configurationPath="swiftgram-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber=34492 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts"

      - name: Verify generated IPA
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Build artifacts"
          echo "========================================"

          find build/artifacts \
            -maxdepth 2 \
            -type f \
            -print | sort

          if [ ! -f "build/artifacts/Swiftgram.ipa" ]; then
            echo
            echo "ERROR: Swiftgram.ipa was not generated."
            exit 1
          fi

          echo
          echo "IPA successfully generated:"
          ls -lh "build/artifacts/Swiftgram.ipa"

          echo
          echo "Checking IPA contents:"
          unzip -l "build/artifacts/Swiftgram.ipa" | head -40

      - name: Upload Swiftgram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-iOS-27-arm64
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.DSYMs.zip
          if-no-files-found: error
          retention-days: 7
