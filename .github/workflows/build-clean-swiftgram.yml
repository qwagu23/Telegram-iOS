name: Build Clean Swiftgram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select required Xcode
        run: |
          set -e

          XCODE_VERSION=$(python3 - <<'PY'
          import json

          with open("versions.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["xcode"])
          PY
          )

          echo "Required Xcode: $XCODE_VERSION"

          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Required Xcode was not found:"
            echo "$XCODE_PATH"
            echo
            echo "Available Xcode installations:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo
          echo "Selected Xcode:"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -e

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

          cd /Users/Shared/telegram-ios

          echo "Source directory:"
          pwd

          echo
          echo "Git commit:"
          git rev-parse --short HEAD

      - name: Prepare Swiftgram build configuration
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          python3 - <<'PY'
          import json
          from pathlib import Path

          build_system = Path("build-system")

          appstore_path = build_system / "appstore-configuration.json"
          output_path = build_system / "ci-swiftgram-configuration.json"

          if not appstore_path.exists():
              raise SystemExit(
                  f"ERROR: {appstore_path} was not found."
              )

          with appstore_path.open("r", encoding="utf-8") as f:
              config = json.load(f)

          print("Original configuration keys:")
          print(sorted(config.keys()))

          if "sg_config" not in config:
              print()
              print("sg_config is missing.")
              print("Searching build-system JSON files...")

              candidates = []

              preferred = [
                  build_system / "template_minimal_development_configuration.json",
                  build_system / "template_minimal_configuration.json",
                  build_system / "appcenter-configuration.json",
                  build_system / "development-configuration.json",
              ]

              for path in preferred:
                  if path.exists() and path not in candidates:
                      candidates.append(path)

              for path in sorted(build_system.rglob("*.json")):
                  if path not in candidates and path != appstore_path:
                      candidates.append(path)

              found = None

              for path in candidates:
                  try:
                      with path.open("r", encoding="utf-8") as f:
                          candidate = json.load(f)
                  except Exception:
                      continue

                  if isinstance(candidate, dict) and "sg_config" in candidate:
                      found = (path, candidate["sg_config"])
                      break

              if found is None:
                  print()
                  print("ERROR: sg_config could not be found.")
                  print()
                  print("JSON files checked:")
                  for path in candidates:
                      print(" -", path)
                  exit(1)

              source_path, sg_config = found

              print(f"Found sg_config in: {source_path}")

              config["sg_config"] = sg_config

          output_path.write_text(
              json.dumps(
                  config,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print("Generated configuration:")
          print(output_path)

          print()
          print("Final configuration keys:")
          print(sorted(config.keys()))

          print()
          print("sg_config:")
          print(
              json.dumps(
                  config["sg_config"],
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY

          echo
          echo "Validating generated JSON..."

          python3 -m json.tool \
            build-system/ci-swiftgram-configuration.json \
            > /dev/null

          echo "JSON validation successful."

      - name: Import fake signing certificates
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Build clean arm64 IPA
        run: |
          set -e
          set -o pipefail

          cd /Users/Shared/telegram-ios

          CACHE_DIR="$HOME/telegram-bazel-cache"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "Build number: $BUILD_NUMBER"
          echo "Commit count: $COMMIT_COUNT"
          echo "Build number offset: $BUILD_NUMBER_OFFSET"
          echo "Cache directory: $CACHE_DIR"

          python3 -u build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/ci-swiftgram-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Locate generated IPA
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "Searching for generated IPA..."
          echo

          IPA_PATH=""

          # Standard output location used by the Telegram build system.
          if [ -f "build/artifacts/Telegram.ipa" ]; then
            IPA_PATH="build/artifacts/Telegram.ipa"
            echo "Found standard output:"
            echo "$IPA_PATH"
          fi

          # Fallback: search through symlinks as well.
          if [ -z "$IPA_PATH" ]; then
            echo "Standard output was not found."
            echo "Searching the repository with symlink traversal..."

            IPA_PATH="$(find -L . \
              -type f \
              -name "*.ipa" \
              -print \
              2>/dev/null | head -n 1 || true)"
          fi

          # Fallback: search common Bazel output locations explicitly.
          if [ -z "$IPA_PATH" ] && [ -d "bazel-bin" ]; then
            echo "Searching bazel-bin..."

            IPA_PATH="$(find -L bazel-bin \
              -type f \
              -name "*.ipa" \
              -print \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$IPA_PATH" ]; then
            echo
            echo "ERROR: Build finished but no IPA was found."
            echo

            echo "Contents of build/:"
            find -L build \
              -maxdepth 5 \
              -print \
              2>/dev/null | head -n 200 || true

            echo
            echo "Contents matching IPA / Telegram:"
            find -L . \
              \( -iname "*telegram*" -o -iname "*.ipa" \) \
              -print \
              2>/dev/null | head -n 300 || true

            exit 1
          fi

          echo
          echo "IPA found:"
          echo "$IPA_PATH"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$IPA_PATH" \
            "$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

          echo
          echo "Copied IPA:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

      - name: Verify IPA
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

          echo "Testing IPA archive..."

          unzip -t "$IPA"

          echo
          echo "IPA archive is valid."

          echo
          echo "Application contents:"
          unzip -l "$IPA" \
            | grep "Payload/" \
            | head -n 50 || true

      - name: Upload Swiftgram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-clean-IPA
          path: output/Swiftgram-clean.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
