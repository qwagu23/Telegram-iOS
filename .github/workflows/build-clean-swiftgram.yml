name: Build Clean Swiftgram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select required Xcode
        run: |
          set -e

          XCODE_VERSION=$(python3 - <<'PY'
          import json

          with open("versions.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["xcode"])
          PY
          )

          echo "Required Xcode: $XCODE_VERSION"

          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Required Xcode was not found:"
            echo "$XCODE_PATH"
            echo
            echo "Available Xcode installations:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo
          echo "Selected Xcode:"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -e

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

          cd /Users/Shared/telegram-ios

          echo "Source directory:"
          pwd

          echo
          echo "Git commit:"
          git rev-parse --short HEAD

      - name: Diagnose provisioning profiles
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          PROFILE_DIR="build-system/fake-codesigning/profiles"

          echo "========================================"
          echo "Provisioning profiles diagnostic"
          echo "========================================"
          echo

          if [ ! -d "$PROFILE_DIR" ]; then
            echo "ERROR: Profiles directory not found:"
            echo "$PROFILE_DIR"
            exit 1
          fi

          echo "Files in profiles directory:"
          find "$PROFILE_DIR" -maxdepth 3 -type f -print

          echo
          echo "========================================"
          echo "Decoding provisioning profiles"
          echo "========================================"

          FOUND=0

          while IFS= read -r -d '' PROFILE; do
            FOUND=$((FOUND + 1))

            echo
            echo "----------------------------------------"
            echo "Profile: $PROFILE"
            echo "----------------------------------------"

            TEMP_PLIST="$(mktemp)"

            if security cms -D -i "$PROFILE" > "$TEMP_PLIST" 2>/dev/null; then
              /usr/libexec/PlistBuddy -c "Print :Name" "$TEMP_PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :UUID" "$TEMP_PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$TEMP_PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$TEMP_PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$TEMP_PLIST" 2>/dev/null || echo "aps-environment: MISSING"

              echo "Profile decoded successfully."
            else
              echo "Could not decode this file as a provisioning profile."
            fi

            rm -f "$TEMP_PLIST"

          done < <(find "$PROFILE_DIR" -type f \( -name "*.mobileprovision" -o -name "*.provisionprofile" \) -print0)

          echo
          echo "========================================"
          echo "Total profile files found: $FOUND"
          echo "Diagnostic completed."
          echo "========================================"

          exit 0

      - name: Prepare Swiftgram build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build_system = Path("build-system")

          template_path = (
              build_system /
              "template_minimal_development_configuration.json"
          )

          appstore_path = (
              build_system /
              "appstore-configuration.json"
          )

          output_path = (
              build_system /
              "ci-swiftgram-configuration.json"
          )

          if not template_path.exists():
              raise SystemExit(
                  f"ERROR: Template not found: {template_path}"
              )

          if not appstore_path.exists():
              raise SystemExit(
                  f"ERROR: App Store configuration not found: {appstore_path}"
              )

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

          if not api_id or not api_hash:
              raise SystemExit(
                  "ERROR: Telegram API secrets are missing."
              )

          with template_path.open("r", encoding="utf-8") as f:
              config = json.load(f)

          with appstore_path.open("r", encoding="utf-8") as f:
              appstore_config = json.load(f)

          config["bundle_id"] = "org.artiom.swiftgramcustom"
          config["api_id"] = api_id
          config["api_hash"] = api_hash

          team_id = appstore_config.get("team_id", "")

          if team_id:
              config["team_id"] = team_id

          if not config.get("sg_config"):
              if appstore_config.get("sg_config"):
                  config["sg_config"] = appstore_config["sg_config"]

          output_path.write_text(
              json.dumps(
                  config,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("Swiftgram configuration generated.")
          print("Bundle ID:", config["bundle_id"])
          print("Team ID:", config.get("team_id", ""))
          print("API credentials: loaded from GitHub Secrets")
          print("API credentials are not displayed.")
          print(
              "sg_config:",
              "present" if config.get("sg_config") else "empty"
          )
          PY

          echo
          echo "Validating generated JSON..."

          python3 -m json.tool \
            build-system/ci-swiftgram-configuration.json \
            > /dev/null

          echo "JSON validation successful."

      - name: Import fake signing certificates
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Build clean arm64 IPA
        run: |
          set -e
          set -o pipefail

          cd /Users/Shared/telegram-ios

          CACHE_DIR="$HOME/telegram-bazel-cache"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "Build number: $BUILD_NUMBER"
          echo "Commit count: $COMMIT_COUNT"
          echo "Build number offset: $BUILD_NUMBER_OFFSET"
          echo "Cache directory: $CACHE_DIR"

          python3 -u build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/ci-swiftgram-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Locate generated IPA
        run: |
          set -e

          cd /Users/Shared/telegram-ios

          echo "Searching for generated IPA..."
          echo

          IPA_PATH=""

          if [ -f "build/artifacts/Telegram.ipa" ]; then
            IPA_PATH="build/artifacts/Telegram.ipa"
            echo "Found standard output:"
            echo "$IPA_PATH"
          fi

          if [ -z "$IPA_PATH" ]; then
            echo "Standard output was not found."
            echo "Searching the repository with symlink traversal..."

            IPA_PATH="$(find -L . \
              -type f \
              -name "*.ipa" \
              -print \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$IPA_PATH" ] && [ -d "bazel-bin" ]; then
            echo "Searching bazel-bin..."

            IPA_PATH="$(find -L bazel-bin \
              -type f \
              -name "*.ipa" \
              -print \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$IPA_PATH" ]; then
            echo
            echo "ERROR: Build finished but no IPA was found."
            echo

            echo "Contents of build/:"
            find -L build \
              -maxdepth 5 \
              -print \
              2>/dev/null | head -n 200 || true

            echo
            echo "Contents matching IPA / Telegram:"
            find -L . \
              \( -iname "*telegram*" -o -iname "*.ipa" \) \
              -print \
              2>/dev/null | head -n 300 || true

            exit 1
          fi

          echo
          echo "IPA found:"
          echo "$IPA_PATH"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$IPA_PATH" \
            "$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

          echo
          echo "Copied IPA:"
          ls -lh \
            "$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

      - name: Verify IPA
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/output/Swiftgram-clean.ipa"

          echo "Testing IPA archive..."

          unzip -t "$IPA"

          echo
          echo "IPA archive is valid."

          echo
          echo "Application contents:"
          unzip -l "$IPA" \
            | grep "Payload/" \
            | head -n 50 || true

      - name: Upload Swiftgram IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-clean-IPA
          path: output/Swiftgram-clean.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
